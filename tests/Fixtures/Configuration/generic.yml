schema: 1
repository: Example/app
app:
  id: example
  main_branch: main
branches:
  stable_pattern: '/^stable-(?<nextcloud>\d+)$/'
version:
  source: metadata.xml
  tag_prefix: v
history:
  previous_release: reachable-tag
  initial_ref: initial-release-baseline
changelog:
  strategy: per-major
  path: 'changelog/{major}.md'
  package_root: CHANGELOG.md
milestones:
  patch: 'Patch {version}'
  rc: 'RC {version}'
authorization:
  prepare_min_permission: write
  merge_min_permission: maintain
package:
  command:
    - ./bin/package
    - --verify

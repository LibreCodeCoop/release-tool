name: PHAR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: phar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/box validate
      - name: Build first PHAR
        run: composer build:phar && cp build/release-tool.phar build/release-tool.first.phar
      - name: Build second PHAR
        run: composer build:phar
      - name: Verify reproducible build
        run: test "$(sha256sum build/release-tool.first.phar | awk '{print $1}')" = "$(sha256sum build/release-tool.phar | awk '{print $1}')"
      - run: composer test:phar
      - name: SHA-256
        run: sha256sum build/release-tool.phar | tee build/release-tool.phar.sha256

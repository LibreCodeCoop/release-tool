name: Publish release-tool
on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
permissions: {}
jobs:
  tag_0_10_8:
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish 0.10.8]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Create v0.10.8 tag
        env:
          TAG: v0.10.8
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Checkout v0.10.8
        run: git checkout --detach v0.10.8

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/box validate
      - run: composer build:phar
      - run: composer test:phar

      - name: Verify embedded version
        run: php build/release-tool.phar --version | grep -F "0.10.8"

      - name: Generate checksum
        run: |
          cd build
          sha256sum release-tool.phar > release-tool.phar.sha256

      - name: Publish release-tool 0.10.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.10.8 >/dev/null 2>&1; then
            echo "Release v0.10.8 already exists."
            exit 0
          fi
          gh release create v0.10.8 \
            build/release-tool.phar \
            build/release-tool.phar.sha256 \
            --verify-tag \
            --title "release-tool 0.10.8" \
            --generate-notes

  publish:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/box validate
      - run: composer build:phar
      - run: composer test:phar
      - name: Verify embedded version
        run: |
          version="${TAG#v}"
          php build/release-tool.phar --version | grep -F "${version}"
      - name: Generate checksum
        run: |
          cd build
          sha256sum release-tool.phar > release-tool.phar.sha256
      - name: Publish GitHub release
        run: |
          gh release create "${TAG}" \
            build/release-tool.phar \
            build/release-tool.phar.sha256 \
            --verify-tag \
            --title "release-tool ${TAG#v}" \
            --generate-notes

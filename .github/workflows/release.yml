name: Publish release-tool
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
    paths:
      - VERSION
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release-tool-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION must contain an exact semantic version, got '${version}'"
            exit 2
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi

          if [[ "${tag}" != "v${version}" ]]; then
            echo "::error::release tag ${tag} does not match VERSION v${version}"
            exit 2
          fi

          existing_sha=""
          if ! existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null)"; then
            existing_sha=""
          fi
          if [[ -n "${existing_sha}" && "${existing_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::tag ${tag} already points to ${existing_sha}, expected ${GITHUB_SHA}"
            exit 2
          fi

          if [[ -z "${existing_sha}" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            git tag "${tag}" "${GITHUB_SHA}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Release already exists
        if: steps.release.outputs.published == 'true'
        env:
          PUBLISHED_TAG: ${{ steps.release.outputs.tag }}
        run: echo "Release ${PUBLISHED_TAG} is already published; nothing to do."

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        if: steps.release.outputs.published != 'true'
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        if: steps.release.outputs.published != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHAR configuration
        if: steps.release.outputs.published != 'true'
        run: vendor/bin/box validate

      - name: Build PHAR
        if: steps.release.outputs.published != 'true'
        run: composer build:phar

      - name: Test PHAR
        if: steps.release.outputs.published != 'true'
        run: composer test:phar

      - name: Verify embedded version
        if: steps.release.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: php build/release-tool.phar --version | grep -F "${RELEASE_VERSION}"

      - name: Generate checksum
        if: steps.release.outputs.published != 'true'
        run: |
          cd build
          sha256sum release-tool.phar > release-tool.phar.sha256

      - name: Publish GitHub release
        if: steps.release.outputs.published != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            build/release-tool.phar \
            build/release-tool.phar.sha256 \
            --verify-tag \
            --title "release-tool ${TAG#v}" \
            --generate-notes

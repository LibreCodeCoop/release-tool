name: Publish release-tool v0.10.16
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.10.16.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: v0.10.16
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/box validate
      - run: composer build:phar
      - run: composer test:phar
      - name: Verify embedded version
        run: |
          version="${TAG#v}"
          php build/release-tool.phar --version | grep -F "${version}"
      - name: Generate checksum
        run: |
          cd build
          sha256sum release-tool.phar > release-tool.phar.sha256
      - name: Publish GitHub release
        run: |
          gh release create "${TAG}" \
            build/release-tool.phar \
            build/release-tool.phar.sha256 \
            --verify-tag \
            --title "release-tool ${TAG#v}" \
            --generate-notes

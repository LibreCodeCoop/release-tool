name: Bootstrap Composer lock

on:
  push:
    branches:
      - feat/bootstrap-release-tool

permissions:
  contents: write

jobs:
  lock:
    if: "${{ !contains(github.event.head_commit.message, 'chore: generate composer lock') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate lock
        run: composer update --no-interaction --no-progress
      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: generate composer lock" -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push
